name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: test (Go ${{ matrix.go }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        go: ['1.23']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}

      - name: Cache Homebrew bottles (macOS)
        if: runner.os == 'macOS'
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew/downloads
          key: brew-bottles-${{ runner.os }}-codecs-v1

      - name: Install cgo deps (macOS)
        if: runner.os == 'macOS'
        # v0.22+ decoder subpackages add jpeg2000 (openjp2), jpegxl (libjxl),
        # avif (libavif), webp (libwebp), htj2k (openjph).
        # HOMEBREW_NO_AUTO_UPDATE skips the slow formula-index refresh; bottles
        # are restored from the cache above.
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: brew install jpeg-turbo openjpeg jpeg-xl libavif webp openjph pkg-config

      - name: Install cgo deps (Linux, cached)
        if: runner.os == 'Linux'
        # Ubuntu apt has all the codec libs EXCEPT openjph (HTJ2K); Linux
        # test/build steps use -tags nohtj2k to skip it. cache-apt-pkgs-action
        # caches the .debs and skips `apt-get update` on a hit — replacing the
        # transient-mirror retry loop (cache hit = no network).
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: libturbojpeg0-dev libopenjp2-7-dev libjxl-dev libavif-dev libwebp-dev pkg-config
          version: '1'

      - name: go vet
        if: runner.os == 'macOS'
        run: go vet ./...

      - name: go vet (Linux, nohtj2k)
        if: runner.os == 'Linux'
        run: go vet -tags nohtj2k ./...

      - name: go test (cgo, with race) — macOS
        if: runner.os == 'macOS'
        run: go test ./... -race -count=1 -timeout 5m

      - name: go test (cgo, with race, nohtj2k) — Linux
        if: runner.os == 'Linux'
        # openjph not packaged in Ubuntu apt; htj2k cgo path skipped via
        # the per-codec opt-out tag. The stub still registers; only the
        # cgo decoder bytes are excluded.
        run: go test -tags nohtj2k ./... -race -count=1 -timeout 5m

      - name: go build (nocgo)
        env:
          CGO_ENABLED: '0'
        run: go build ./...

      - name: go test (nocgo)
        env:
          CGO_ENABLED: '0'
        run: go test ./... -tags nocgo -count=1 -timeout 5m

  asan:
    name: asan (cgo decoders)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Install cgo deps (Linux, cached)
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: libturbojpeg0-dev libopenjp2-7-dev libjxl-dev libavif-dev libwebp-dev pkg-config
          version: '1'
      # AddressSanitizer over the cgo codec decoders. The committed
      # decoder/jpeg2000/testdata fixtures (incl. the 4:2:2 subsampled tile
      # that triggered the #7 heap over-read) are decoded here, so a
      # regression of that bug class — in ANY cgo decoder exercised by a
      # test — fails the build. Linux uses nohtj2k (openjph not in apt);
      # the remaining cgo decoders (jpeg, jpeg2000, webp, avif, jpegxl) are
      # covered. Leak detection is off (Go runtime + cgo are noisy there).
      - name: go test -asan ./decoder/...
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: go test -asan -tags nohtj2k ./decoder/... -count=1 -timeout 10m

  # Integration against the public WSILabs/wsi-fixtures corpus. The full local
  # sample set is ~10 GB and gitignored; wsi-fixtures ships small CC0 versions
  # of a subset. The integration-backed tests (TestSlideParity, per-format
  # reader/decoder tests) skip-if-missing, so they exercise whatever the corpus
  # provides. Both jobs run ONLY the fixture-env-gated packages (root, formats,
  # internal, tests) — the rest already run under -race in the `test` job, so
  # re-running them here adds nothing.
  #
  # Linux runs on every push + PR. The macOS variant (full codec set incl.
  # HTJ2K via openjph) runs on push only — HTJ2K stays gated on every merge to
  # main, just not on every PR iteration, keeping PR turnaround fast.
  #
  # `make parity` (full oracle) and `make cover` (80%/pkg gate) still need the
  # complete local sample set and remain release-readiness-only.
  integration:
    name: integration (public fixtures, Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install cgo deps (Linux, cached)
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: libturbojpeg0-dev libopenjp2-7-dev libjxl-dev libavif-dev libwebp-dev pkg-config
          version: '1'

      - name: Download public fixture corpus (WSILabs/wsi-fixtures)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/tars" "$RUNNER_TEMP/wsi-fixtures"
          # Resolve the newest fixture-corpus release (v1, v2, …) explicitly
          # instead of trusting the repo's "Latest" pointer: a non-corpus
          # release (e.g. a tools-* validator-binary mirror) can grab Latest
          # and carry no *.tar, which would silently break this download.
          TAG="$(gh release list --repo WSILabs/wsi-fixtures --json tagName \
            --jq '.[].tagName' | grep -E '^v[0-9]+(\.[0-9]+)*$' | sort -V | tail -1)"
          echo "fixture corpus tag: ${TAG:?no v* corpus release found}"
          gh release download "$TAG" --repo WSILabs/wsi-fixtures \
            --pattern '*.tar' --dir "$RUNNER_TEMP/tars"
          for t in "$RUNNER_TEMP/tars"/*.tar; do
            tar xf "$t" -C "$RUNNER_TEMP/wsi-fixtures"
          done
          echo "OPENTILE_TESTDIR=$RUNNER_TEMP/wsi-fixtures" >> "$GITHUB_ENV"
          echo "corpus formats:"; ls "$RUNNER_TEMP/wsi-fixtures"

      - name: go test (fixture-backed packages, nohtj2k)
        run: go test -tags nohtj2k . ./formats/... ./internal/... ./tests/... -count=1 -timeout 15m

  # macOS integration — adds HTJ2K (openjph) coverage. Push-only (skipped on
  # PRs) so PR turnaround isn't gated on the slower macOS runner.
  integration-htj2k:
    name: integration (public fixtures, macOS + HTJ2K)
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          # Do NOT persist the Go build cache for this job. It links openjph
          # (HTJ2K) via `#cgo pkg-config: openjph`, and Go's build cache does
          # not track pkg-config output as a cache input — so a restored cache
          # replays stale cgo LDFLAGS that embed the *versioned* Homebrew Cellar
          # path (e.g. .../openjph/0.27.4/lib). When brew later installs a newer
          # openjph (0.30.1), that path is gone and every cgo link fails with
          # `ld: library 'openjph' not found`. A fresh GOCACHE forces cgo to
          # re-run pkg-config against the currently-installed openjph.
          cache: false

      - name: Cache Homebrew bottles (macOS)
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew/downloads
          key: brew-bottles-${{ runner.os }}-codecs-v1

      - name: Install cgo deps (macOS)
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: brew install jpeg-turbo openjpeg jpeg-xl libavif webp openjph pkg-config

      - name: Download public fixture corpus (WSILabs/wsi-fixtures)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/tars" "$RUNNER_TEMP/wsi-fixtures"
          # Resolve the newest fixture-corpus release (v1, v2, …) explicitly
          # instead of trusting the repo's "Latest" pointer: a non-corpus
          # release (e.g. a tools-* validator-binary mirror) can grab Latest
          # and carry no *.tar, which would silently break this download.
          TAG="$(gh release list --repo WSILabs/wsi-fixtures --json tagName \
            --jq '.[].tagName' | grep -E '^v[0-9]+(\.[0-9]+)*$' | sort -V | tail -1)"
          echo "fixture corpus tag: ${TAG:?no v* corpus release found}"
          gh release download "$TAG" --repo WSILabs/wsi-fixtures \
            --pattern '*.tar' --dir "$RUNNER_TEMP/tars"
          for t in "$RUNNER_TEMP/tars"/*.tar; do
            tar xf "$t" -C "$RUNNER_TEMP/wsi-fixtures"
          done
          echo "OPENTILE_TESTDIR=$RUNNER_TEMP/wsi-fixtures" >> "$GITHUB_ENV"
          echo "corpus formats:"; ls "$RUNNER_TEMP/wsi-fixtures"

      - name: go test (fixture-backed packages, full codecs incl HTJ2K)
        run: go test . ./formats/... ./internal/... ./tests/... -count=1 -timeout 20m

  # macOS+HTJ2K's sibling on Windows — full-codec coverage via vcpkg
  # x64-mingw-static (openjph is not an msys2 package; vcpkg is the only path
  # that builds it for MinGW). Push-only (skipped on PRs) — the vcpkg codec
  # build is heavy; the binary cache keeps warm runs fast. Static-linked MinGW
  # libs; no -race (cgo+race on Windows Go is brittle — covered on Linux/macOS).
  integration-windows:
    name: integration (public fixtures, Windows + all codecs)
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Set up MSYS2 mingw toolchain
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf

      - name: Put MSYS2 mingw64 on PATH
        run: |
          # setup-msys2's mingw64 (gcc + pkgconf) — NOT git-bash's /mingw64,
          # which is Git's own mingw and has no gcc/pkgconf.
          echo "${{ steps.msys2.outputs.msys2-location }}\\mingw64\\bin" >> "$GITHUB_PATH"

      - name: Bootstrap vcpkg (pinned baseline)
        run: |
          set -euo pipefail
          git clone https://github.com/microsoft/vcpkg "$RUNNER_TEMP/vcpkg"
          BASELINE=$(python -c "import json;print(json.load(open('vcpkg.json'))['builtin-baseline'])")
          git -C "$RUNNER_TEMP/vcpkg" checkout "$BASELINE"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/vcpkg-bincache"
          echo "VCPKG_DEFAULT_BINARY_CACHE=$RUNNER_TEMP/vcpkg-bincache" >> "$GITHUB_ENV"

      - name: Restore vcpkg codec cache
        id: vcpkgcache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-x64-mingw-static-${{ hashFiles('vcpkg.json') }}

      - name: Install codec libs (vcpkg, x64-mingw-static)
        run: |
          set -euo pipefail
          "$VCPKG_ROOT/vcpkg" install \
            --triplet x64-mingw-static \
            --x-install-root="$PWD/vcpkg_installed"
          echo "PKG_CONFIG_PATH=$PWD/vcpkg_installed/x64-mingw-static/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Save vcpkg codec cache
        # Save right after the slow codec build so the static libs are cached
        # even when a later step (fixtures / test) fails — keeps CI bring-up
        # iterations fast. No-op when the key already exists.
        if: always() && steps.vcpkgcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-x64-mingw-static-${{ hashFiles('vcpkg.json') }}

      - name: Download public fixture corpus (WSILabs/wsi-fixtures)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/tars" "$RUNNER_TEMP/wsi-fixtures"
          # Resolve the newest fixture-corpus release (v1, v2, …) explicitly
          # instead of trusting the repo's "Latest" pointer: a non-corpus
          # release (e.g. a tools-* validator-binary mirror) can grab Latest
          # and carry no *.tar, which would silently break this download.
          TAG="$(gh release list --repo WSILabs/wsi-fixtures --json tagName \
            --jq '.[].tagName' | grep -E '^v[0-9]+(\.[0-9]+)*$' | sort -V | tail -1)"
          echo "fixture corpus tag: ${TAG:?no v* corpus release found}"
          gh release download "$TAG" --repo WSILabs/wsi-fixtures \
            --pattern '*.tar' --dir "$RUNNER_TEMP/tars"
          for t in "$RUNNER_TEMP/tars"/*.tar; do
            # --force-local: GNU tar (git-bash) otherwise reads the Windows
            # drive-letter colon in "D:\a\_temp\..." as an rcp host:path spec
            # ("Cannot connect to D: resolve failed"). Treat the path as local.
            tar --force-local -xf "$t" -C "$RUNNER_TEMP/wsi-fixtures"
          done
          echo "OPENTILE_TESTDIR=$RUNNER_TEMP/wsi-fixtures" >> "$GITHUB_ENV"
          echo "corpus formats:"; ls "$RUNNER_TEMP/wsi-fixtures"

      - name: go build (all six codecs)
        env:
          CGO_ENABLED: '1'
        run: go build ./...

      - name: go vet (all six codecs)
        env:
          CGO_ENABLED: '1'
        run: go vet ./...

      - name: go test (fixture-backed, full codecs incl HTJ2K, no -race)
        env:
          CGO_ENABLED: '1'
        run: go test ./... -count=1 -timeout 30m
