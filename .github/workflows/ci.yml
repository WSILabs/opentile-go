name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test (Go ${{ matrix.go }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        go: ['1.23']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}

      - name: Install cgo deps (macOS)
        if: runner.os == 'macOS'
        # v0.22+ decoder subpackages add jpeg2000 (openjp2), jpegxl (libjxl),
        # avif (libavif), webp (libwebp), htj2k (openjph).
        run: brew install jpeg-turbo openjpeg jpeg-xl libavif webp openjph pkg-config

      - name: Install cgo deps (Linux)
        if: runner.os == 'Linux'
        # Ubuntu apt has all the codec libs EXCEPT openjph (HTJ2K).
        # Use -tags nohtj2k on Linux test/build steps to skip it.
        # Wrap apt in a 3-attempt retry loop for transient mirror failures.
        run: |
          for i in 1 2 3; do
            if sudo apt-get update && sudo apt-get install -y \
                libturbojpeg0-dev libopenjp2-7-dev libjxl-dev \
                libavif-dev libwebp-dev pkg-config; then
              echo "apt install succeeded on attempt $i"
              exit 0
            fi
            echo "apt install attempt $i failed; sleeping 10s before retry..."
            sleep 10
          done
          echo "apt install failed after 3 attempts" >&2
          exit 1

      - name: go vet
        if: runner.os == 'macOS'
        run: go vet ./...

      - name: go vet (Linux, nohtj2k)
        if: runner.os == 'Linux'
        run: go vet -tags nohtj2k ./...

      - name: go test (cgo, with race) — macOS
        if: runner.os == 'macOS'
        run: go test ./... -race -count=1 -timeout 5m

      - name: go test (cgo, with race, nohtj2k) — Linux
        if: runner.os == 'Linux'
        # openjph not packaged in Ubuntu apt; htj2k cgo path skipped via
        # the per-codec opt-out tag. The stub still registers; only the
        # cgo decoder bytes are excluded.
        run: go test -tags nohtj2k ./... -race -count=1 -timeout 5m

      - name: go build (nocgo)
        env:
          CGO_ENABLED: '0'
        run: go build ./...

      - name: go test (nocgo)
        env:
          CGO_ENABLED: '0'
        run: go test ./... -tags nocgo -count=1 -timeout 5m

  asan:
    name: asan (cgo decoders)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Install cgo deps (Linux)
        run: |
          for i in 1 2 3; do
            if sudo apt-get update && sudo apt-get install -y \
                libturbojpeg0-dev libopenjp2-7-dev libjxl-dev \
                libavif-dev libwebp-dev pkg-config; then
              exit 0
            fi
            sleep 10
          done
          exit 1
      # AddressSanitizer over the cgo codec decoders. The committed
      # decoder/jpeg2000/testdata fixtures (incl. the 4:2:2 subsampled tile
      # that triggered the #7 heap over-read) are decoded here, so a
      # regression of that bug class — in ANY cgo decoder exercised by a
      # test — fails the build. Linux uses nohtj2k (openjph not in apt);
      # the remaining cgo decoders (jpeg, jpeg2000, webp, avif, jpegxl) are
      # covered. Leak detection is off (Go runtime + cgo are noisy there).
      - name: go test -asan ./decoder/...
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: go test -asan -tags nohtj2k ./decoder/... -count=1 -timeout 10m

  # Integration suite against the public WSILabs/wsi-fixtures corpus.
  # The full local sample set is ~10 GB and gitignored, but wsi-fixtures
  # ships small CC0 versions of a subset; the integration-backed tests
  # (TestSlideParity, the per-format reader/decoder tests) skip-if-missing,
  # so they exercise whatever the public corpus provides. macOS gets the
  # full codec set (incl. HTJ2K via openjph); Linux runs nohtj2k.
  #
  # The full-fixture parity oracle (`make parity`) and the 80%-per-package
  # coverage gate (`make cover`) still need the complete local sample set
  # and remain release-readiness-only.
  integration:
    name: integration (public fixtures, Go 1.23 / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install cgo deps (macOS)
        if: runner.os == 'macOS'
        run: brew install jpeg-turbo openjpeg jpeg-xl libavif webp openjph pkg-config

      - name: Install cgo deps (Linux)
        if: runner.os == 'Linux'
        run: |
          for i in 1 2 3; do
            if sudo apt-get update && sudo apt-get install -y \
                libturbojpeg0-dev libopenjp2-7-dev libjxl-dev \
                libavif-dev libwebp-dev pkg-config; then
              exit 0
            fi
            sleep 10
          done
          exit 1

      - name: Download public fixture corpus (WSILabs/wsi-fixtures)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/tars" "$RUNNER_TEMP/wsi-fixtures"
          gh release download --repo WSILabs/wsi-fixtures \
            --pattern '*.tar' --dir "$RUNNER_TEMP/tars"
          for t in "$RUNNER_TEMP/tars"/*.tar; do
            tar xf "$t" -C "$RUNNER_TEMP/wsi-fixtures"
          done
          echo "OPENTILE_TESTDIR=$RUNNER_TEMP/wsi-fixtures" >> "$GITHUB_ENV"
          echo "corpus formats:"; ls "$RUNNER_TEMP/wsi-fixtures"

      - name: go test (integration, macOS — full codecs)
        if: runner.os == 'macOS'
        run: go test ./... -count=1 -timeout 15m

      - name: go test (integration, Linux — nohtj2k)
        if: runner.os == 'Linux'
        run: go test -tags nohtj2k ./... -count=1 -timeout 15m
